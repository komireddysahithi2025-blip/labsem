
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>College Portal</h1>
        <p class="subtitle">Login to your account</p>

        <div class="tabs">
            <button type="button" onclick="showLogin()">Login</button>
            <button type="button" onclick="showSignup()">Student Signup</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm">
            <h2>Login</h2>

            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail"
                   placeholder="Enter email" required>

            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword"
                   placeholder="Enter password" required>

            <label for="loginRole">Select Role</label>
            <select id="loginRole" required>
                <option value="student">Student</option>
                <option value="admin">Admin</option>
            </select>

            <button type="submit">Login</button>
        </form>

        <!-- Student Signup Form -->
        <form id="signupForm" hidden>
            <h2>Student Registration</h2>

            <label for="studentName">Full Name</label>
            <input type="text" id="studentName"
                   placeholder="Enter full name" required>

            <label for="studentEmail">Email</label>
            <input type="email" id="studentEmail"
                   placeholder="Enter email" required>

            <label for="studentPassword">Password</label>
            <input type="password" id="studentPassword"
                   placeholder="Minimum 6 characters"
                   minlength="6" required>

            <button type="submit">Register</button>
        </form>

        <!-- Dashboard -->
        <section id="dashboard" hidden>
            <h2 id="welcome"></h2>
            <div id="dashboardContent"></div>
            <button type="button" id="logoutButton">Logout</button>
        </section>

        <p id="message" role="status"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
